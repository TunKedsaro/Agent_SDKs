services:
  openai-agent:
    build:
      context: .
      dockerfile: openai_agent/Dockerfile
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Please set OPENAI_API_KEY in the .env file}
      TAVILY_API_KEY: ${TAVILY_API_KEY:?Please set TAVILY_API_KEY in the .env file}
    volumes:
      - ./openai_agent:/workspace
      - ./shared:/workspace/shared

  pi-agent:
    build:
      context: .
      dockerfile: pi_agent/Dockerfile
    ports:
      - "${PI_JUPYTER_PORT:-8889}:8888"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Please set OPENAI_API_KEY in the .env file}
      TAVILY_API_KEY: ${TAVILY_API_KEY:?Please set TAVILY_API_KEY in the .env file}
    volumes:
      - ./pi_agent:/workspace/pi_agent
      - ./shared:/workspace/shared